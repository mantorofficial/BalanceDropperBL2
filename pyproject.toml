[project]
name = "BalanceDropper"
version = "2.0"
authors = [{ name = "Ty-Gone" }]

description = "Drop loot from any Item and ItemPool directly at your feet via a searchable blimgui UI. Also requires modder_commands not in the db"
dependencies = [
  "blimgui >= 1.1",
]

[tool.sdkmod]
supported_games = ["BL2"]
coop_support = "ClientSide"
license = { name = "MIT", url = "https://choosealicense.com/licenses/mit/" }
download = "https://raw.githubusercontent.com/mantorofficial/BalanceDropperBL2/main/BalanceDropper.sdkmod"
