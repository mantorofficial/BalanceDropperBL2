[project]
name = "BalanceDropper"
version = "1.0.0"
authors = [{ name = "Ty-Gone" }]

description = "Drop loot from any Item and ItemPool directly at your feet via a searchable blimgui UI."
dependencies = [
  "blimgui >= 1.0",
]

[tool.sdkmod]
supported_games = ["BL2"]
coop_support = "Co-op Friendly"
license = { name = "MIT", url = "https://choosealicense.com/licenses/mit/" }
download = "https://github.com/mantorofficial/BalanceDropperBL2/raw/refs/heads/main/BalanceDropper.sdkmod"
